<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Jarvis workspace concept</title><desc id="desc">Original futuristic desktop workspace concept with command, context and agent panels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080d"/><stop offset=".55" stop-color="#080d14"/><stop offset="1" stop-color="#020304"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111923" stop-opacity=".92"/><stop offset="1" stop-color="#090d12" stop-opacity=".92"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#315f9d"/><stop offset="1" stop-color="#a9ceff"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#b5d2ff" stroke-opacity=".045"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
