<text x="350" y="205" fill="#647687" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2">ACTIVE THREAD</text><text x="350" y="246" fill="#f0f5fb" font-family="Arial,sans-serif" font-weight="600" font-size="34">Continue from where we stopped.</text><rect x="905" y="215" width="165" height="42" rx="4" fill="#10243c" stroke="#83b4f6" stroke-opacity=".35"/><text x="987" y="241" text-anchor="middle" fill="#bcd8ff" font-family="ui-monospace,Consolas,monospace" font-size="11">RUN WITH CONTEXT</text>
